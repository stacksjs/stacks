<!-- Wide-format dawn horizon for the marketing band and the holding page.
  Daylight variant.

  Every path here is lifted from coming-soon-dawn.svg, itself Laravel
  5.7's 503.svg (https://github.com/laravel/laravel, MIT License) recolored to
  a warm dusk palette. Nothing is redrawn, so this cannot drift from the original.

  How the 1024 square becomes a 1600x500 band:

    dunes    stretched x1.5625 across and flattened to 0.6173 tall. An organic
             curve does not mind being a wider, lower dune.
    village  unstretched at 0.62. Its base sits on the crest curve solved at
             its own x (y=294 at x=1010), NOT on a single constant: the crest
             runs from y=229 at x=500 to y=303 at x=1120, so a constant left
             it hanging 61 units above the sand.
    sun      unstretched at 0.8, just above the crest at its x.
    clouds   unstretched at 0.92.

  Colour: the site's golden-hour ramp, the same one 404.svg carries, so the
  illustration and the site share one palette instead of arguing. The sky
  runs #71230A ember umber -> #9C3510 burnt sienna -> #FF8A4C coral glow ->
  #FFF6CB cream at the horizon, the sun stays warm white, and the dune
  shadows are #8E2C15. -->
