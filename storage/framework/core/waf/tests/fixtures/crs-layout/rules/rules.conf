# From CRS's REQUEST-901-INITIALIZATION.conf
# CRS sets allowed_methods only when crs-setup.conf (rule 900200) did not.
SecRule &TX:allowed_methods "@eq 0" "id:901160,phase:1,pass,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# From CRS's REQUEST-911-METHOD-ENFORCEMENT.conf
SecRule REQUEST_METHOD "!@within %{tx.allowed_methods}" \
    "id:911100,phase:1,block,t:none,msg:'Method is not allowed by policy',severity:'CRITICAL',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# From CRS's REQUEST-913-SCANNER-DETECTION.conf
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile scanners-user-agents.data" \
    "id:913100,phase:1,block,t:none,t:lowercase,msg:'Found User-Agent associated with security scanner',severity:'CRITICAL',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# From CRS's REQUEST-949-BLOCKING-EVALUATION.conf
SecRule TX:INBOUND_ANOMALY_SCORE_PL1 "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:949110,phase:2,deny,status:403,t:none,log,msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.INBOUND_ANOMALY_SCORE_PL1})'"

