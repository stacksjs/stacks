# A CRS checkout's shape, reduced: crs-setup.conf at the root, the rules and
# their .data files under rules/. Rules adapted from the OWASP Core Rule Set 4
# (Apache-2.0, https://coreruleset.org).
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900990,phase:1,pass,nolog,t:none,setvar:tx.critical_anomaly_score=5,setvar:tx.inbound_anomaly_score_pl1=0"
