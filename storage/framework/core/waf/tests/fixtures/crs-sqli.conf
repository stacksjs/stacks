# Adapted from the OWASP Core Rule Set 4 (Apache-2.0, https://coreruleset.org):
# rule 942100 from REQUEST-942-APPLICATION-ATTACK-SQLI.conf and rule 949110
# from REQUEST-949-BLOCKING-EVALUATION.conf, with the CRS defaults they rely on.
# Trimmed to what the tests need; a real app points security.waf.rules at a
# full CRS checkout instead.

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900990,phase:1,pass,nolog,t:none,setvar:tx.critical_anomaly_score=5,setvar:tx.inbound_anomaly_score_pl1=0"

SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer|ARGS_NAMES|ARGS "@detectSQLi" \
    "id:942100,phase:2,block,capture,t:none,t:urlDecodeUni,t:removeNulls,msg:'SQL Injection Attack Detected via libinjection',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule TX:INBOUND_ANOMALY_SCORE_PL1 "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:949110,phase:2,deny,status:403,t:none,log,msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.INBOUND_ANOMALY_SCORE_PL1})'"
