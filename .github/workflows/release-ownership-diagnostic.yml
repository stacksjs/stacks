name: Windows release ownership diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-ownership-diagnostic:
    name: Repeated timeout disposal (diagnostic only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Observe the native Win32 Job Object ABI
        shell: bash
        run: |
          bun .github/scripts/windows-job-abi.ts
      - name: Repeat the unchanged consumer deadline and immediate disposal check
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun test ./storage/framework/core/actions/tests/release-evidence.test.ts --test-name-pattern 'does not accept a timed-out check that handles termination and exits zero' --rerun-each=100 2>&1 | tee artifacts/windows-timeout-ownership.log
      - name: Execute the complete native ownership regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun test ./storage/framework/core/actions/tests/release-evidence.test.ts ./storage/framework/core/actions/tests/project-scripts.test.ts 2>&1 | tee artifacts/windows-owner-regressions.log
      - name: Repeat real final-output cancellation ordering
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun test ./storage/framework/core/actions/tests/project-scripts.test.ts --test-name-pattern 'cancellation at final command output' --rerun-each=50 2>&1 | tee artifacts/windows-completion-race.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-timeout-ownership-diagnostic
          path: artifacts/windows-*.log
          if-no-files-found: error

  minimum-bun-native-job-abi:
    name: Native Job Object ABI on minimum Bun
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Require the actual minimum-version native ABI
        shell: bash
        run: bun .github/scripts/windows-job-abi.ts
