name: Windows release ownership diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-ownership-diagnostic:
    name: Repeated timeout disposal (diagnostic only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Observe the native Win32 Job Object ABI
        shell: bash
        run: |
          bun --eval '
          import { dlopen, FFIType as f, ptr } from "bun:ffi";
          const { symbols: api } = dlopen("kernel32.dll", {
            GetCurrentProcess: { args: [], returns: f.u64 },
            CreateJobObjectW: { args: [f.ptr, f.ptr], returns: f.u64 },
            SetInformationJobObject: { args: [f.u64, f.i32, f.ptr, f.u32], returns: f.i32 },
            QueryInformationJobObject: { args: [f.u64, f.i32, f.ptr, f.u32, f.ptr], returns: f.i32 },
            CloseHandle: { args: [f.u64], returns: f.i32 },
          });
          if (api.GetCurrentProcess() !== 0xffffffffffffffffn) throw Error("Unexpected process pseudo-handle");
          const job = api.CreateJobObjectW(null, null);
          if (job === 0n) throw Error("Job Object creation failed");
          const limits = new BigUint64Array(18);
          new DataView(limits.buffer).setUint32(16, 0x2000, true);
          if (!api.SetInformationJobObject(job, 9, ptr(limits), limits.byteLength)) throw Error("Job limits failed");
          const accounting = new BigUint64Array(6);
          if (!api.QueryInformationJobObject(job, 1, ptr(accounting), accounting.byteLength, null)) throw Error("Job accounting failed");
          if (new DataView(accounting.buffer).getUint32(40, true) !== 0) throw Error("Unexpected active member");
          if (!api.CloseHandle(job)) throw Error("Job handle close failed");
          console.log("Native Win32 job ABI available; zero active members; handles valid.");
          '
      - name: Repeat the unchanged consumer deadline and immediate disposal check
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun test ./storage/framework/core/actions/tests/release-evidence.test.ts --test-name-pattern 'does not accept a timed-out check that handles termination and exits zero' --rerun-each=100 2>&1 | tee artifacts/windows-timeout-ownership.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-timeout-ownership-diagnostic
          path: artifacts/windows-timeout-ownership.log
          if-no-files-found: error
