name: Deploy owned site

# A host can reconcile its own routes without hosting any attached app's source.
on:
  workflow_dispatch:
    inputs:
      retire_domains:
        description: Omitted hostnames deliberately retired from this project's gateway
        type: string
        default: ''
permissions:
  contents: read
  deployments: write
concurrency:
  group: owned-site-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pantry-pm/pantry/packages/action@624cd6674f8c5c2d4e4204c11ece62a00d7fac0a
        with:
          version: '0.11.184'
          install: 'false'
          packages: 'bun.com@1.4.4 git-scm.org curl.se sqlite.org'
      - run: bun install --frozen-lockfile
      - name: Prepare deployment identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
      - name: Deploy this project's main site and gateway
        env:
          RETIRE_DOMAINS: ${{ inputs.retire_domains }}
          APP_ENV: production
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          args=(--prod --site main --yes)
          if [ -n "$RETIRE_DOMAINS" ]; then args+=(--retire-domains "$RETIRE_DOMAINS"); fi
          ./buddy deploy "${args[@]}"
