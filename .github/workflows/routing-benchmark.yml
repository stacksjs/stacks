name: Routing diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Throughput matrix, per-request CPU cost, or stock HTTP CPU profiles
        type: choice
        default: benchmark
        options:
          - benchmark
          - cost
          - profile
          - machine
          - machine-symbols
      rate:
        description: Fixed requests per second per target in cost mode. Low enough that the slowest target still attains it on a shared runner.
        type: string
        default: '10000'

permissions:
  contents: read

concurrency:
  group: routing-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Hosted runners are shared machines, not publication hosts.
      BENCH_DEDICATED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@fa35547da630b14beda5b26a2625490864d5c963 # v0.11.60
        with:
          version: '0.11.60'
          install: 'false'

      - name: Install project and benchmark dependencies
        run: |
          pantry install
          bun install --cwd bench/routing --frozen-lockfile

      - name: Install oha 1.16.0
        env:
          OHA_SHA256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716
        run: |
          mkdir -p "$RUNNER_TEMP/oha/bin"
          pantry/curl.se/v8.22.0/bin/curl -fsSL \
            https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64 \
            -o "$RUNNER_TEMP/oha/bin/oha"
          echo "$OHA_SHA256  $RUNNER_TEMP/oha/bin/oha" | sha256sum --check
          chmod +x "$RUNNER_TEMP/oha/bin/oha"
          echo "$RUNNER_TEMP/oha/bin" >> "$GITHUB_PATH"

      # Diagnostic artifacts must not change the source state being measured.
      - name: Record source before measurement
        run: |
          mkdir -p "$RUNNER_TEMP/routing-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/routing-diagnostic/source-before-revision.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/routing-diagnostic/source-before-status.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/routing-diagnostic/source-before.patch"

      - name: Measure the full routing matrix
        if: inputs.mode == 'benchmark'
        run: bun bench/routing/run.ts --driver oha --warmup 5 --duration 30 --runs 3 --output "$RUNNER_TEMP/routing-diagnostic"

      # A shared runner is where saturating throughput is least informative and
      # cost per request is most: every target answers the same fixed rate, so
      # a noisy neighbour lengthens the wall clock without changing what each
      # server charged for the work it did.
      - name: Measure per-request CPU cost
        if: inputs.mode == 'cost'
        run: bun bench/routing/run.ts --driver oha --rate "${{ inputs.rate }}" --warmup 5 --duration 30 --runs 3 --output "$RUNNER_TEMP/routing-diagnostic"

      - name: Capture stock HTTP CPU profiles
        if: inputs.mode == 'profile'
        run: bun bench/routing/profile.ts --output "$RUNNER_TEMP/routing-diagnostic"

      # `perf` needs a linux-tools package matching the running kernel, which a
      # hosted runner does not have. The versioned binaries from
      # linux-tools-generic attach anyway for software events, and the runner
      # grants sudo, so paranoid can be lowered to let them.
      - name: Install perf
        if: startsWith(inputs.mode, 'machine')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Profile at the machine level
        if: inputs.mode == 'machine'
        run: |
          bun bench/routing/perf.ts \
            --targets stacks-minimal,elysia,bun-raw \
            --scenario path-param \
            --rate "${{ inputs.rate }}" \
            --duration 20 \
            --output "$RUNNER_TEMP/routing-diagnostic"

      # The released Bun is stripped, so its own frames profile as bare
      # addresses. The profile build carries symbols; the servers inherit
      # whichever binary runs the runner through `process.execPath`, so
      # invoking it directly is all it takes. That build is slower than the
      # release one, so its shares describe itself - use it to name functions,
      # not to size them.
      - name: Profile against a symbolized Bun
        if: inputs.mode == 'machine-symbols'
        run: |
          BUN_VERSION=$(bun --version)
          curl -fsSL -o "$RUNNER_TEMP/bun-profile.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-profile.zip"
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun-profile.zip"
          PROFILE_BUN=$(find "$RUNNER_TEMP" -type f -name 'bun-profile' | head -1)
          chmod +x "$PROFILE_BUN"
          "$PROFILE_BUN" --version
          "$PROFILE_BUN" bench/routing/perf.ts \
            --targets stacks-minimal,elysia,bun-raw \
            --scenario path-param \
            --rate "${{ inputs.rate }}" \
            --duration 20 \
            --runs 2 \
            --output "$RUNNER_TEMP/routing-diagnostic"

      - name: Record source after measurement
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/routing-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/routing-diagnostic/source-after-revision.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/routing-diagnostic/source-after-status.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/routing-diagnostic/source-after.patch"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: routing-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/routing-diagnostic
          if-no-files-found: error
          retention-days: 30
