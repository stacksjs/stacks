name: Configure Launchpad deployment access

# Host credential setup only. Launchpad owns its cloud configuration and deploys
# its website and API from stacksjs/launchpad through cloud.attachTo.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure the dedicated protected deployment environment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for name in HCLOUD_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEPLOY_SSH_KEY; do
            test -n "${!name}"
            printf '%s' "${!name}" | gh secret set "$name" --repo stacksjs/launchpad --env website-production
          done
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s' "$SSH_KNOWN_HOSTS" | gh secret set SSH_KNOWN_HOSTS --repo stacksjs/launchpad --env website-production
          fi
