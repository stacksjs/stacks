name: Buddy Restart Windows

on:
  push:
    branches: [main]
    paths: &restart_paths
      - '.github/workflows/buddy-serve-windows.yml'
      - 'storage/framework/core/actions/src/dev/app-session*.ts'
      - 'storage/framework/core/actions/src/dev/api.ts'
      - 'storage/framework/core/actions/src/dev/views.ts'
      - 'storage/framework/core/actions/src/dev/frontend-hmr*.ts'
      - 'storage/framework/core/actions/src/dev/dashboard*.ts'
      - 'storage/framework/core/actions/tests/dashboard-software-updates.test.ts'
      - 'storage/framework/core/actions/tests/fixtures/dashboard-restart-worker.ts'
      - 'storage/framework/core/actions/src/helpers/serve-relay-worker.ts'
      - 'storage/framework/core/actions/src/serve/api.ts'
      - 'storage/framework/core/buddy/src/commands/dev.ts'
      - 'storage/framework/core/buddy/src/commands/serve.ts'
      - 'storage/framework/core/buddy/tests/dev-standalone-restart.test.ts'
      - 'storage/framework/core/buddy/tests/dev-frontend-hmr.test.ts'
      - 'storage/framework/core/buddy/src/production-server.ts'
      - 'storage/framework/core/buddy/src/serve-*.ts'
      - 'storage/framework/core/buddy/tests/serve-restart.test.ts'
      - 'storage/framework/core/cli/src/owned-process.ts'
      - 'storage/framework/core/cli/src/serve-relay.ts'
  pull_request:
    branches: [main]
    paths: *restart_paths

permissions:
  contents: read

jobs:
  rolling-restart:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun .github/scripts/source-release-evidence.ts build
      - name: Exercise rolling web and API restarts with live traffic
        env:
          APP_ENV: test
        run: bun test ./storage/framework/core/buddy/tests/serve-restart.test.ts
      - name: Exercise rolling dashboard restarts with live traffic
        env:
          APP_ENV: test
        run: bun test ./storage/framework/core/actions/tests/dashboard-software-updates.test.ts --test-name-pattern "dashboard restart keeps"
      - name: Exercise rolling combined and standalone dev restarts
        env:
          APP_ENV: test
        run: bun test ./storage/framework/core/buddy/tests/dev-standalone-restart.test.ts
      - name: Verify frontend state survives a worker swap in Chrome
        env:
          APP_ENV: test
          STACKS_BROWSER_TESTS: '1'
          CHROME_PATH: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: bun test ./storage/framework/core/buddy/tests/dev-frontend-hmr.test.ts
