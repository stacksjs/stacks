name: Releaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  # Read-only, and required: naming any scope here sets every unnamed one to
  # `none`, so without this the `serialize` job's `gh run list` gets a 403 and
  # blocks every release instead of ordering them.
  actions: read

# One group PER TAG, not one for all releases.
#
# Tag releases still have to run one at a time — see the `serialize` job below,
# which is where that now happens. But a single shared group cannot express
# "queue them all": GitHub holds at most ONE pending run per concurrency group,
# so when a third run arrives while one is in progress and one is pending, the
# pending one is CANCELLED. With `cancel-in-progress: false` that looks safe and
# is not: on 2026-08-16 six consecutive releases (v0.71.5 through v0.71.10) were
# all cancelled this way and npm sat three hours behind main, with every run
# reporting "cancelled" rather than "failed" so nothing alerted.
#
# Keying the group on the ref means two different tags never contend, so no
# release is ever dropped. Re-pushing the SAME tag still serializes, which is
# the one case where cancelling the older run is right.
concurrency:
  group: stacks-framework-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Serialization moved here from the concurrency group, because a queue that
  # silently discards its contents is worse than no queue.
  #
  # Publishing a workspace exposes packages one at a time, so a newer compatible
  # version entering npm resolution while an older tag's clean-install smoke
  # test is still running would make that test assert against the wrong tree.
  # This job waits for any Releaser run with a LOWER run number to finish, which
  # gives the same ordering the shared group intended without the cancellation.
  # Run number rather than start time, so the order is stable no matter what
  # order GitHub happens to start queued runs in.
  #
  # It waits on `in_progress` only, deliberately not `queued`. Counting queued
  # runs would be stricter, but every waiter holds a runner, so a burst of
  # releases could end up with all of them waiting on older runs that cannot get
  # a runner because the waiters are using them. Ordering can slip if an older
  # run is still waiting for a runner when we start; that is a far smaller
  # problem than either deadlocking the pool or the old behaviour of dropping
  # releases outright.
  serialize:
    name: wait for earlier releases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for older in-progress releases
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_number }}
        run: |
          set -uo pipefail
          # Poll rather than fail fast: a release ahead of us is expected, and
          # the right response is to wait our turn, not to drop this version.
          for _ in $(seq 1 180); do
            # Fail OPEN. Ordering is a nicety; publishing is the requirement.
            # If the API is rate-limited or the token is short a scope, shipping
            # unserialized is a small risk, whereas blocking here would recreate
            # the very problem this job exists to prevent — a release that never
            # reaches npm.
            if ! older=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Releaser" \
              --status in_progress \
              --limit 100 \
              --json number \
              --jq "[.[] | select(.number < ${THIS_RUN})] | length" 2>&1); then
              echo "::warning title=Release ordering::Could not query earlier runs (${older}). Proceeding without waiting."
              exit 0
            fi
            if [ "$older" -eq 0 ]; then
              echo "No earlier release in flight; proceeding."
              exit 0
            fi
            echo "Waiting on ${older} earlier release run(s)..."
            sleep 20
          done
          # An hour of waiting means something is stuck, not busy. Ship anyway
          # and say so loudly: a warning on a release that went out beats a
          # release that silently did not.
          echo "::warning title=Release ordering::Still waiting after an hour; proceeding without waiting. Check for a wedged Releaser run."
          exit 0

  # Publication requires a completed successful Main CI run for this exact
  # release commit, including all platform ownership checks. A successful npm
  # build or artifact check cannot override a failed source job.
  source-ci:
    name: accept exact release source CI
    needs: serialize
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      # The committed graph supplies the repository's normal preload.
      # Source acceptance itself makes read-only GitHub API requests.
      - name: Install the committed dependency graph
        run: bun install --frozen-lockfile
      - name: Require complete CI for this exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/await-release-ci.ts

  # RELEASE_GATE_BYPASS applies only to the additional generated-document checks.
  # It never bypasses exact-source CI acceptance above.
  release-gate:
    name: release gate
    needs: [serialize, source-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d # v0.11.130
        with:
          version: '0.11.130'
          install: 'false'
          packages: bun.com@1.4.4 git-scm.org@2.53.0

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        # Matches the npm job's install rather than CI's --frozen-lockfile, so
        # the gate validates exactly the tree the release will publish and
        # cannot block on a lockfile difference the release itself tolerates.
        run: bun install

      # A workspace can resolve undeclared siblings through the umbrella SDK.
      # Verify each published package's own contract before any registry writes.
      - name: Verify published dependency declarations
        run: bun test ./tests/declared-dependencies.test.ts

      - name: Verify pinned checks against the tagged commit
        if: vars.RELEASE_GATE_BYPASS != 'true'
        # Every check runs even after one fails, so a release blocked by two
        # stale artifacts reports both instead of hiding the second behind the
        # first. `::error::` surfaces each failure in the run summary.
        run: |
          status=0
          for check in \
            docs:buddy:check \
            docs:artifacts:check \
            docs:links:check
          do
            echo "::group::$check"
            if timeout 120s bun run "$check"; then
              echo "$check ok"
            else
              echo "::error title=Release gate::$check failed. Regenerate the artifact and create a new patch release."
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Gate bypassed
        if: vars.RELEASE_GATE_BYPASS == 'true'
        run: echo "::warning title=Release gate bypassed::RELEASE_GATE_BYPASS is set, so the pinned checks did not run for this release."

  npm:
    name: npm
    needs: release-gate
    runs-on: ubuntu-latest
    # Publication can wait up to thirty minutes for npm automated review,
    # in addition to package builds, uploads, clean-install checks and binaries.
    timeout-minutes: 180  # the publish waits out npm propagation, layer by layer
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d # v0.11.130
        with:
          version: '0.11.130'
          install: 'false'
          packages: bun.com@1.4.4 git-scm.org@2.53.0

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      # Build each publishable framework package's dist BEFORE publishing.
      # We publish with `pantry --ignore-scripts` (skips prepublishOnly `tsc`
      # steps that fail in-workspace), so dist must already exist here.
      - name: Build framework packages
        run: |
          failed=""
          for dir in storage/framework/core/*/ storage/framework/core; do
            pkg="${dir%/}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": *true' "$pkg" && continue
            grep -q '"build"' "$pkg" || continue
            echo "Building ${dir%/}"
            if (cd "${dir%/}" && bun run build); then :; else
              echo "::error::build failed for ${dir%/}"
              failed="${failed} ${dir%/}"
            fi
          done
          # Fail the release on ANY build failure — a swallowed failure here is
          # exactly how 0.70.88 shipped dist-less (publish runs --ignore-scripts,
          # so a missing dist is never rebuilt).
          if [ -n "$failed" ]; then
            echo "::error::One or more package builds failed:${failed}"
            exit 1
          fi

      # Belt-and-suspenders against a dist-less publish: every publishable
      # package, including the umbrella, must have a non-empty dist/ before we publish
      # with --ignore-scripts. A build that "succeeds" but emits nothing is
      # caught here instead of shipping an empty tarball to npm.
      - name: Verify built dist
        run: |
          missing=""
          for dir in storage/framework/core/*/ storage/framework/core; do
            pkg="${dir%/}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": *true' "$pkg" && continue
            grep -q '"build"' "$pkg" || continue
            # Defaults ships resources/app instead of a JS dist. Other
            # packages, including the umbrella and lint, must ship JS.
            case "${dir%/}" in
              storage/framework/core/defaults) continue ;;
            esac
            if [ -z "$(find "${dir%/}/dist" -name '*.js' -type f 2>/dev/null | head -1)" ]; then
              echo "::error::no built dist/*.js for ${dir%/}"
              missing="${missing} ${dir%/}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish — dist missing for:${missing}"
            exit 1
          fi

      # Publish the framework through pantry. Scoped core/* packages use a
      # holding tag and are promoted as one set. The unscoped `stacks`
      # meta-package is then published directly to latest through OIDC because
      # the legacy token cannot mutate that package's dist-tags. pantry resolves
      # workspace:* → concrete versions, topo-orders, skips already-published
      # versions, and falls back to NPM_TOKEN outside OIDC.
      #
      # Uploading 86 packages takes minutes, and each one used to land on
      # `latest` as it went, so for that whole window the registry described no
      # single release. An install resolving `^0.74.12` got whatever each
      # package had reached: one CI run pulled `@stacksjs/actions@0.74.12`
      # alongside `@stacksjs/ai@0.74.13` and produced an app that could not
      # resolve its own imports. `buddy new` is unreliable for real users in
      # that window, not just for CI (stacksjs/stacks#2056).
      #
      # Promotion is a metadata write per package, so the disagreement window
      # is limited to the tag writes. A failed promotion may leave a partial
      # set: fail honestly and resume it before declaring the release complete.
      #
      # Without NPM_TOKEN there is no way to run `npm dist-tag`, and a release
      # stuck on the holding tag would be worse than the tearing. So that case
      # publishes straight to `latest`, exactly as before.
      - name: Publish Framework
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          bun .github/scripts/check-pantry-version.ts

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "No NPM_TOKEN: publishing straight to latest (promotion needs npm auth)."
            pantry publish --npm --access public --ignore-scripts 'storage/framework/core/*' 'storage/framework/core'
            exit 0
          fi

          # A dependency layer at a time, each layer in parallel: a package only
          # waits for the ones it depends on to be readable on npm, not for every
          # package before it (two hours and more one by one). Each package still
          # goes through publish-npm.sh, which waits out an accepted upload npm
          # has not shown yet and resumes it. --no-readback: pantry stops at
          # npm's acceptance instead of polling each package until it is
          # readable (most of a minute each, often the full timeout); the
          # staging tag keeps them off latest, and promote-latest.ts confirms
          # every package is readable before it moves latest.
          bun .github/scripts/publish-layers.ts --npm --access public --ignore-scripts --tag staging --no-readback

          # Promotion uses the same scoped token and honors registry cooldowns.
          bun .github/scripts/promote-latest.ts

          # The unscoped meta-package has trusted publishing configured, but
          # the legacy token cannot mutate its dist-tags. Publish it through
          # OIDC only after every scoped package is on latest; this final write
          # is the release commit point for `buddy upgrade` consumers.
          # --no-readback: the next step asks the registry for this exact
          # version before it installs, so pantry's own minute-long poll for it
          # only delayed that.
          rm -f ~/.npmrc
          pantry publish --npm --access public --no-readback --ignore-scripts 'storage/framework/core'

      # Publishing succeeded is not enough: registry manifests can still carry
      # monorepo-only protocols that make the package impossible to install.
      # Exercise the public artifact from a clean, non-workspace directory.
      #
      # Two failures wear the same costume here, and only one of them is ours:
      #
      #   1. The manifest cannot ever install — a `workspace:` protocol escaped
      #      into the published artifact. Deterministic, ours, and worth
      #      failing the release over.
      #   2. npm has not finished propagating. ~180 packages go out per
      #      release, and metadata appears on the CDN edges well before every
      #      tarball does.
      #
      # The second is not a defect in what we published, so it must not fail
      # the release. It did: v0.74.41 published every package correctly and
      # went red because `@stacksjs/defaults` became visible a minute after the
      # retry budget ran out. Everything after this step — the dummy libs, the
      # VS Code extension, the GitHub release assets — was skipped for a
      # release that was entirely fine, which is the real cost.
      #
      # So the outcome is decided on evidence rather than on a clock: ask the
      # registry whether the versions we are waiting for actually exist. If
      # they do, this is propagation and the release continues with a warning.
      # If they do not, the publish genuinely lost a package and the release
      # fails, however long it took to find out.
      - name: Verify published framework install
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          echo '{"name":"stacks-release-smoke","private":true}' > package.json

          installed=false
          attempts=30
          for attempt in $(seq 1 "$attempts"); do
            # Force fresh manifests each retry: a package published near the
            # end of the workspace can be absent from metadata the first failed
            # install cached. The per-attempt timeout bounds a network stall so
            # one bad connection cannot hold the serialized release queue.
            if timeout 120s bun add --no-cache "stacks@$version" 2>install.log; then
              installed=true
              break
            fi

            # A protocol or resolution error means the published artifact is
            # broken. Retrying cannot fix it, and waiting twelve minutes to say
            # so helps nobody.
            if grep -qiE 'workspace:|EUNSUPPORTEDPROTOCOL|unsupported URL type' install.log; then
              cat install.log
              echo "::error::stacks@$version published a manifest that cannot be installed (workspace protocol leaked into the artifact)"
              exit 1
            fi

            [ "$attempt" -eq "$attempts" ] && break

            # Report a retry as ONE line, and dump the log only when the
            # release actually fails.
            #
            # This loop used to `cat install.log` on every attempt. Publishing
            # ~180 packages means the metadata for `stacks` can be visible
            # before its dependencies are, so bun emits several `error:` lines
            # per attempt about versions that do exist and are simply not
            # readable from this edge yet. Thirty attempts of that turns a
            # release that is working exactly as designed into a wall of red,
            # and someone reasonably reads it as a broken publish and starts
            # debugging a non-problem.
            #
            # The waiting is normal. Only the giving up is news.
            if grep -q 'No version matching' install.log; then
              waiting_on="$(grep -oE 'for specifier "[^"]+"' install.log | sed 's/for specifier //; s/"//g' | sort -u | paste -sd' ' -)"
              echo "attempt $attempt/$attempts: registry has not propagated ${waiting_on:-stacks@$version} yet - retrying"
            else
              echo "attempt $attempt/$attempts: install failed, first line was:"
              head -1 install.log
            fi

            # 10s for the first minute, then 30s: quick when the registry is
            # quick, patient when it is not.
            if [ "$attempt" -le 6 ]; then sleep 10; else sleep 30; fi
          done

          if [ "$installed" = true ]; then
            bun node_modules/@stacksjs/buddy/dist/cli.js --help >/dev/null
            echo "stacks@$version installs from a clean project"
            exit 0
          fi

          # Metadata alone does not prove that a consumer can fetch the
          # archives, resolve the graph, and execute the installed CLI.
          cat install.log
          echo "::error::stacks@$version could not be installed and verified from a clean project after $attempts attempts. Publication requires investigation before this release can be accepted."
          {
            echo "### Release verification failed"
            echo ""
            echo "Clean-project installation of \`stacks@$version\` did not succeed within the retry budget."
            echo "Registry metadata alone cannot establish that the published framework is usable."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish Dummy Libraries
        run: ./storage/framework/scripts/publish-dummy-libs
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The extension's tests include a build that must load as CommonJS on
      # Node, the way VS Code loads it, so a bundle VS Code would refuse is
      # never published. `bun run release` packages with --no-dependencies and
      # then adds the stx TypeScript plugin's node_modules entry, which vsce
      # leaves out, before publishing that VSIX (scripts/package.ts).
      - name: Publish VS Code Extension
        continue-on-error: true
        run: |
          cd storage/framework/defaults/ide/vscode
          bun install
          bun test ./tests
          bun run release
          cd ../../../../
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract tag version
        id: get_version
        run: |
          version=${GITHUB_REF#refs/tags/}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Buddy Release Assets
        run: |
          cd storage/framework/core/buddy
          bun run compile:all
          bun run zip:all

      - name: Create GitHub Release
        uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d # v0.11.130
        with:
          version: '0.11.130'
          install: 'false'
          release: 'true'
          release-tag: ${{ steps.get_version.outputs.version }}
          release-files: |
            storage/framework/core/buddy/bin/buddy-linux-x64.zip
            storage/framework/core/buddy/bin/buddy-linux-arm64.zip
            storage/framework/core/buddy/bin/buddy-windows-x64.zip
            storage/framework/core/buddy/bin/buddy-darwin-x64.zip
            storage/framework/core/buddy/bin/buddy-darwin-arm64.zip
          release-changelog: auto
          release-token: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: npm
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Debug Tag
        run: |
          echo "Tag: ${GITHUB_REF#refs/tags/}"
          echo "Version from previous job: ${{ needs.npm.outputs.version }}"

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: stacksjs
          repositories: homebrew-tap

      - name: Setup GitHub CLI with PAT
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Ensure Homebrew Tap Repository Exists
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          tap_ready=false
          for attempt in $(seq 1 240); do
            if output=$(gh api repos/stacksjs/homebrew-tap 2>&1); then
              tap_ready=true
              echo "homebrew-tap repository already exists"
              break
            fi

            if echo "$output" | grep -q 'HTTP 404'; then
              echo "Creating homebrew-tap repository..."
              if gh repo create stacksjs/homebrew-tap --public --description "Homebrew tap for Stacks packages"; then
                tap_ready=true
                break
              fi
              echo "::warning::Repository creation was not confirmed; reconciling before retry"
            else
              echo "::warning::Homebrew tap lookup failed transiently; retrying (attempt $attempt/240)"
            fi

            delay=$((attempt < 7 ? attempt * 5 : 30))
            sleep "$delay"
          done

          if [ "$tap_ready" != true ]; then
            echo "::error::Could not confirm the Homebrew tap after extended retries"
            exit 1
          fi

      - name: Authenticate GitHub CLI with App Token
        run: echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token

      - name: Wait for Release Assets
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Waiting for release assets to be available..."

          # Wait for assets to be available (max 10 minutes)
          TIMEOUT=600
          START_TIME=$(date +%s)

          while [ $(( $(date +%s) - START_TIME )) -lt $TIMEOUT ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://github.com/stacksjs/stacks/releases/download/$VERSION/buddy-darwin-arm64.zip)
            echo "HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Assets are available!"
              break
            fi

            echo "Assets not ready yet, waiting 10 seconds..."
            sleep 10
          done

          if [ $(( $(date +%s) - START_TIME )) -ge $TIMEOUT ]; then
            echo "Timed out waiting for assets, proceeding anyway..."
          fi

          # Force continue even if we couldn't detect the file
          # Sometimes GitHub's API can be inconsistent
          echo "Continuing with asset download..."

      - name: Download Binaries Directly
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p .github/temp
          cd .github/temp

          # Try direct download with retries
          download_with_retry() {
            local url=$1
            local output=$2
            local max_retries=5
            local retry=0

            while [ $retry -lt $max_retries ]; do
              echo "Downloading $url (attempt $(($retry + 1))/$max_retries)"
              if curl -L -s -f "$url" -o "$output"; then
                echo "Downloaded $output successfully"
                return 0
              fi
              echo "Download failed, retrying in 5 seconds..."
              retry=$((retry + 1))
              sleep 5
            done

            echo "Failed to download $url after $max_retries attempts"
            return 1
          }

          download_with_retry "https://github.com/stacksjs/stacks/releases/download/$VERSION/buddy-darwin-arm64.zip" "buddy-darwin-arm64.zip"
          download_with_retry "https://github.com/stacksjs/stacks/releases/download/$VERSION/buddy-darwin-x64.zip" "buddy-darwin-x64.zip"
          download_with_retry "https://github.com/stacksjs/stacks/releases/download/$VERSION/buddy-linux-arm64.zip" "buddy-linux-arm64.zip"
          download_with_retry "https://github.com/stacksjs/stacks/releases/download/$VERSION/buddy-linux-x64.zip" "buddy-linux-x64.zip"

          cd ../..

      - name: Update Homebrew Formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          bash .github/scripts/update-homebrew-formula.sh $VERSION

      - name: Push to Homebrew Tap Repository
        run: |
          # Clone the tap repo using GitHub App token
          git clone https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/stacksjs/homebrew-tap.git

          # Set up Git config
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy the formula to the tap repo
          mkdir -p Formula
          cp ../.github/homebrew/stacks.rb Formula/

          # Check if there are changes to commit
          if git status --porcelain | grep -q .; then
            # Push the changes to the tap repo
            git add Formula/stacks.rb
            git commit -m "chore: update stacks formula to ${GITHUB_REF#refs/tags/}"
            git push
            echo "Successfully updated homebrew formula!"
          else
            echo "No changes to commit"
          fi
