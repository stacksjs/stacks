[Unit]
After=host-app-backup.service host-app-backup-retry.service host-backup-check.service
RequiresMountsFor=/var/lib/stacks-deployments

[Service]
ExecStart=
ExecStart=/usr/local/sbin/stacks-host-ops host-backup --drill

# Initial full snapshots and both-provider restores include multi-GiB databases.
TimeoutStartSec=6h
