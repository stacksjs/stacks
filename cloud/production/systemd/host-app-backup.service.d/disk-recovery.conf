[Unit]
RequiresMountsFor=/var/lib/stacks-deployments/host-backup-staging

[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/stacks-host-ops inventory
ExecStart=
ExecStart=/usr/local/sbin/stacks-host-ops host-backup --preserve-backups

# Initial full snapshots and both-provider restores include multi-GiB databases.
TimeoutStartSec=6h
